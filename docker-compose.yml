services:
  postgres:
    image: postgres:16-alpine
    container_name: quantergy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quantergy}
      POSTGRES_USER: ${POSTGRES_USER:-quantergy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quantergy}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quantergy} -d ${POSTGRES_DB:-quantergy}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
